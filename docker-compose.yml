services:
  mariadb:
    image: mariadb:10.11
    container_name: bandauto-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-sourcing_db}
      MYSQL_USER: ${DB_USER:-banduser}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: bandauto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  shop-app:
    image: bandauto-shop:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.shop
      args:
        APP_NAME: shop
        APP_PORT: 3000
    container_name: bandauto-shop
    ports:
      - "3000:3000"
    env_file:
      - path: ./shop-app/.env.local
        required: false
    environment:
      DATABASE_URL: mysql://${DB_USER:-banduser}:${DB_PASSWORD}@mariadb:3306/${DB_NAME:-sourcing_db}?connection_limit=10&pool_timeout=30
      REDIS_URL: redis://redis:6379
      PRODUCT_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/product
      POST_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/post
      CHANNEL_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/channel
      SHOP_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/shop
    volumes:
      - /home/ubuntu/assets:/home/ubuntu/assets
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  sourcing-app:
    image: bandauto-sourcing:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.sourcing
    container_name: bandauto-sourcing
    ports:
      - "3001:3001"
    env_file:
      - path: ./sourcing-app/.env
        required: false
    environment:
      DATABASE_URL: mysql://${DB_USER:-banduser}:${DB_PASSWORD}@mariadb:3306/${DB_NAME:-sourcing_db}?connection_limit=10&pool_timeout=30
      REDIS_URL: redis://redis:6379
      PRODUCT_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/product
      POST_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/post
      CHANNEL_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/channel
      SHOP_IMAGE_STORAGE_PATH: /home/ubuntu/assets/images/shop
    volumes:
      - /home/ubuntu/assets:/home/ubuntu/assets
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
