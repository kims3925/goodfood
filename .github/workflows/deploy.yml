name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: shop
            port: 3000
          - service: sourcing
            port: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.service }}
            APP_PORT=${{ matrix.port }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            cd ~/bandauto

            # Login to GitHub Container Registry
            echo $GHCR_PAT | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Image prefix (lowercase)
            IMAGE=ghcr.io/${{ github.repository_owner }}/bandauto

            # Create network if not exists
            docker network create bandauto-network 2>/dev/null || true

            # Pull and run shop (port 3000)
            docker pull ${IMAGE}/shop:latest
            docker stop bandauto-shop 2>/dev/null || true
            docker rm bandauto-shop 2>/dev/null || true
            docker run -d \
              --name bandauto-shop \
              --network bandauto-network \
              -p 3000:3000 \
              -e PORT=3000 \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e NEXTAUTH_SECRET="${NEXTAUTH_SECRET}" \
              -e NEXTAUTH_URL="${NEXTAUTH_URL}" \
              --restart unless-stopped \
              ${IMAGE}/shop:latest

            # Pull and run sourcing (port 3001)
            docker pull ${IMAGE}/sourcing:latest
            docker stop bandauto-sourcing 2>/dev/null || true
            docker rm bandauto-sourcing 2>/dev/null || true
            docker run -d \
              --name bandauto-sourcing \
              --network bandauto-network \
              -p 3001:3001 \
              -e PORT=3001 \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e NEXTAUTH_SECRET="${NEXTAUTH_SECRET}" \
              -e NEXTAUTH_URL="${NEXTAUTH_URL}" \
              --restart unless-stopped \
              ${IMAGE}/sourcing:latest

            # Cleanup old images
            docker image prune -f
