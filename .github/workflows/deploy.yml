name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd db && npx prisma generate --schema prisma

      - name: Build shop-app
        run: cd shop-app && npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GUEST_TOKEN_SECRET: ${{ secrets.GUEST_TOKEN_SECRET }}

      - name: Build sourcing-app
        run: cd sourcing-app && npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bandauto

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm ci

            # Generate Prisma Client
            cd db && npx prisma generate --schema prisma && cd ..

            # Build apps
            cd shop-app && npm run build && cd ..
            cd sourcing-app && npm run build && cd ..

            # Reload PM2 processes (zero-downtime)
            pm2 reload all --update-env

            # Show status
            pm2 status
