name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  ECR_REGISTRY: 178788708152.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  ci:
    name: Lint & Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (shop-app)
        run: pnpm run typecheck:shop

      - name: Typecheck (sourcing-app)
        run: pnpm run typecheck:sourcing
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build shop-app
        run: pnpm run build:shop
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          GUEST_TOKEN_SECRET: ci-dummy-secret

      - name: Build sourcing-app
        run: pnpm run build:sourcing
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          JWT_SECRET: ci-dummy-secret

  build-and-push:
    name: Build and Push to ECR
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # GitHub-hosted runner는 기본 14GB인데 Playwright+Node_modules+ONNX 모델 등으로
      # Docker 빌드 중 디스크 고갈("No space left on device") 발생. 사용하지 않는
      # 사전설치 툴체인(dotnet/ghc/boost/android/CodeQL)을 제거해 ~15GB 확보.
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/Ruby" || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/PyPy" || true
          docker image prune -af || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push shop-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.shop
          push: true
          tags: ${{ env.ECR_REGISTRY }}/bandauto-shop:latest
          build-args: |
            APP_NAME=shop
            APP_PORT=3000
            NEXT_PUBLIC_SHOP_DOMAIN=${{ secrets.NEXT_PUBLIC_SHOP_DOMAIN }}
          cache-from: type=gha,scope=bandauto-shop
          cache-to: type=gha,mode=max,scope=bandauto-shop

      - name: Build & Push sourcing-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sourcing
          push: true
          tags: ${{ env.ECR_REGISTRY }}/bandauto-sourcing:latest
          cache-from: type=gha,scope=bandauto-sourcing
          cache-to: type=gha,mode=max,scope=bandauto-sourcing

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get ECR login password
        id: ecr-auth
        run: echo "password=$(aws ecr get-login-password --region ap-northeast-2)" >> $GITHUB_OUTPUT

      # 인라인 SSM 호출 — 외부 액션 의존성 제거
      # 과거 ABC-Group-Tech/.github/actions/ssm-deploy@main / ABC-Group-Tech/ci/actions/...
      # 양쪽 모두 액션 레포 가용성에 종속되어 배포가 실패한 이력이 있음.
      # AWS CLI(v2 사전 설치됨)로 직접 send-command 후 완료 대기.
      - name: Deploy via SSM (inline)
        id: ssm
        env:
          ECR_REGISTRY: 178788708152.dkr.ecr.ap-northeast-2.amazonaws.com
          ECR_PASSWORD: ${{ steps.ecr-auth.outputs.password }}
          INSTANCE_ID: i-0e6ef7c646a61356f
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail

          # ──────────────────────────────────────────────────────────
          # 원격에서 실행할 배포 스크립트 (jq로 JSON 인코딩 후 SSM에 전달)
          # ──────────────────────────────────────────────────────────
          REMOTE_SCRIPT=$(cat <<EOF
          set -e

          # SSM RunCommand는 비대화형 세션이라 \$HOME이 비어 있고,
          # 이 상태에서 git이 "fatal: \$HOME not set"으로 실패함 (exit 128).
          export HOME=/root

          ECR_REGISTRY="${ECR_REGISTRY}"

          echo "==> Docker login to ECR"
          echo "${ECR_PASSWORD}" | docker login --username AWS --password-stdin "\$ECR_REGISTRY"

          echo "==> Pull latest images"
          docker pull "\$ECR_REGISTRY/bandauto-shop:latest"
          docker pull "\$ECR_REGISTRY/bandauto-sourcing:latest"

          echo "==> Re-tag for compose"
          docker tag "\$ECR_REGISTRY/bandauto-shop:latest" bandauto-shop:latest
          docker tag "\$ECR_REGISTRY/bandauto-sourcing:latest" bandauto-sourcing:latest

          echo "==> Sync repo on EC2"
          git config --global --add safe.directory /home/ubuntu/bandauto
          cd /home/ubuntu/bandauto
          git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/ABC-Group-Tech/bandauto.git"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          git remote set-url origin "https://github.com/ABC-Group-Tech/bandauto.git"

          echo "==> docker compose up -d --force-recreate"
          docker compose up -d --force-recreate

          sleep 10

          echo "==> prisma db push"
          docker compose exec -T sourcing-app sh -c "cd /app/db && npx prisma@6 db push --schema prisma" || true

          echo "==> db-migrate.sh"
          bash scripts/db-migrate.sh || true

          docker compose ps
          echo "Deploy completed at \$(date '+%Y-%m-%d %H:%M:%S %Z')"
          EOF
          )

          # ──────────────────────────────────────────────────────────
          # SSM send-command 호출 + 완료 대기
          # ──────────────────────────────────────────────────────────
          echo "==> Sending command to instance ${INSTANCE_ID}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy ${GITHUB_SHA::8}" \
            --timeout-seconds 600 \
            --cloud-watch-output-config CloudWatchOutputEnabled=false \
            --parameters "$(jq -n --arg cmd "$REMOTE_SCRIPT" '{commands: [$cmd], executionTimeout: ["3600"]}')" \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $CMD_ID"

          echo "==> Waiting for command to complete (up to ~10 min)"
          STATUS=""
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "  [$i/60] status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac
          done

          echo "==> Final status: $STATUS"
          echo ""
          echo "==> Output (stdout):"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text || true
          echo ""
          echo "==> Output (stderr):"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command finished with status: $STATUS"
            exit 1
          fi
          echo "Deploy succeeded."
