name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  ECR_REGISTRY: 178788708152.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  ci:
    name: Lint & Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (shop-app)
        run: pnpm run typecheck:shop

      - name: Typecheck (sourcing-app)
        run: pnpm run typecheck:sourcing
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build shop-app
        run: pnpm run build:shop
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          GUEST_TOKEN_SECRET: ci-dummy-secret

      - name: Build sourcing-app
        run: pnpm run build:sourcing
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          JWT_SECRET: ci-dummy-secret

  build-and-push:
    name: Build and Push to ECR
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # GitHub-hosted runner는 기본 14GB인데 Playwright+Node_modules+ONNX 모델 등으로
      # Docker 빌드 중 디스크 고갈("No space left on device") 발생. 사용하지 않는
      # 사전설치 툴체인(dotnet/ghc/boost/android/CodeQL)을 제거해 ~15GB 확보.
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/Ruby" || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/PyPy" || true
          docker image prune -af || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push shop-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.shop
          push: true
          tags: ${{ env.ECR_REGISTRY }}/bandauto-shop:latest
          build-args: |
            APP_NAME=shop
            APP_PORT=3000
            NEXT_PUBLIC_SHOP_DOMAIN=${{ secrets.NEXT_PUBLIC_SHOP_DOMAIN }}
          cache-from: type=gha,scope=bandauto-shop
          cache-to: type=gha,mode=max,scope=bandauto-shop

      - name: Build & Push sourcing-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sourcing
          push: true
          tags: ${{ env.ECR_REGISTRY }}/bandauto-sourcing:latest
          cache-from: type=gha,scope=bandauto-sourcing
          cache-to: type=gha,mode=max,scope=bandauto-sourcing

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get ECR login password
        id: ecr-auth
        run: echo "password=$(aws ecr get-login-password --region ap-northeast-2)" >> $GITHUB_OUTPUT

      - name: Deploy via SSM
        # NOTE: 43353ee에서 ABC-Group-Tech/ci/actions/ssm-deploy@main 으로 변경됐으나
        # 해당 레포가 존재하지 않거나 접근 불가("repository not found")로 모든 배포 실패.
        # 작동하던 ABC-Group-Tech/.github/actions/ssm-deploy@main 으로 임시 복원.
        # ci 레포 마이그레이션이 완료되면 다시 전환 가능.
        uses: ABC-Group-Tech/.github/actions/ssm-deploy@main
        with:
          instance-id: 'i-0e6ef7c646a61356f'
          timeout: '600'
          script: |
            set -e

            ECR_REGISTRY=178788708152.dkr.ecr.ap-northeast-2.amazonaws.com
            ECR_PASSWORD=${{ steps.ecr-auth.outputs.password }}

            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker pull "$ECR_REGISTRY/bandauto-shop:latest"
            docker pull "$ECR_REGISTRY/bandauto-sourcing:latest"

            docker tag "$ECR_REGISTRY/bandauto-shop:latest" bandauto-shop:latest
            docker tag "$ECR_REGISTRY/bandauto-sourcing:latest" bandauto-sourcing:latest

            git config --global --add safe.directory /home/ubuntu/bandauto
            cd /home/ubuntu/bandauto

            GHCR_TOKEN="${{ secrets.GHCR_PAT }}"
            git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/ABC-Group-Tech/bandauto.git"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            git remote set-url origin "https://github.com/ABC-Group-Tech/bandauto.git"

            docker compose up -d --force-recreate

            sleep 10

            docker compose exec -T sourcing-app sh -c "cd /app/db && npx prisma@6 db push --schema prisma" || true

            bash scripts/db-migrate.sh

            docker compose ps
            echo "Deploy completed at $(date '+%Y-%m-%d %H:%M:%S %Z')"