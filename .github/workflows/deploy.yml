name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint & Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (shop-app)
        run: pnpm run typecheck:shop

      - name: Build shop-app
        run: pnpm run build:shop
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          GUEST_TOKEN_SECRET: ci-dummy-secret

      - name: Build sourcing-app
        run: pnpm run build:sourcing
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          JWT_SECRET: ci-dummy-secret

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        uses: ABC-Group-Tech/.github/actions/ssm-deploy@main
        with:
          instance-id: 'i-0e6ef7c646a61356f'
          script: |
            set -e
            cd /home/ubuntu/bandauto

            GHCR_TOKEN="${{ secrets.GHCR_PAT }}"
            git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/ABC-Group-Tech/bandauto.git"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            git remote set-url origin "https://github.com/ABC-Group-Tech/bandauto.git"

            docker compose build --no-cache
            docker compose up -d --force-recreate

            sleep 10

            docker compose exec -T sourcing-app sh -c "cd /app/db && npx prisma@6 db push --schema prisma" || true

            set -a && source /home/ubuntu/bandauto/.env && set +a
            docker compose exec -T mariadb mysql -u"${DB_USER:-banduser}" -p"${DB_PASSWORD}" "${DB_NAME:-sourcing_db}" -e "
              ALTER TABLE guest_order_item ADD COLUMN IF NOT EXISTS is_custom_item TINYINT(1) NOT NULL DEFAULT 0;
              ALTER TABLE guest_order_item MODIFY COLUMN shop_product_id INT NULL;
              ALTER TABLE automation_config ADD COLUMN IF NOT EXISTS collection_limit_by_channel LONGTEXT NULL;
              ALTER TABLE automation_config ADD COLUMN IF NOT EXISTS auto_publish_limit INT NOT NULL DEFAULT 20;
              ALTER TABLE automation_config ADD COLUMN IF NOT EXISTS auto_publish_limit_by_shop LONGTEXT NULL;
              ALTER TABLE automation_config ADD COLUMN IF NOT EXISTS auto_publish_limit_by_channel LONGTEXT NULL;
            " && echo "SQL migration applied" || echo "SQL migration skipped (columns may already exist)"

            docker compose ps
            echo "Deploy completed at $(date '+%Y-%m-%d %H:%M:%S %Z')"
