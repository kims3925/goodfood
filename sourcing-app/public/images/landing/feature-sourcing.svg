<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="12" fill="#EFF6FF"/>
  <!-- Header bar -->
  <rect x="20" y="20" width="440" height="40" rx="8" fill="#DBEAFE"/>
  <text x="32" y="46" font-size="12" fill="#1E40AF" font-family="Arial" font-weight="bold">📦 수집 게시물 관리</text>
  <rect x="360" y="28" width="90" height="24" rx="12" fill="#3B82F6"/>
  <text x="372" y="44" font-size="9" fill="white" font-family="Arial" font-weight="bold">게시물 수집</text>
  <!-- Search bar -->
  <rect x="20" y="72" width="440" height="36" rx="8" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="36" y="94" font-size="10" fill="#9CA3AF" font-family="Arial">🔍 상품명으로 검색...</text>
  <!-- Product card 1 -->
  <rect x="20" y="120" width="210" height="105" rx="8" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
  <rect x="32" y="132" width="60" height="60" rx="6" fill="#BFDBFE"/>
  <text x="50" y="168" font-size="20" fill="#3B82F6">🐟</text>
  <text x="104" y="148" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">싱싱한 활 전복 1kg</text>
  <text x="104" y="164" font-size="9" fill="#60A5FA" font-family="Arial">가족함께수산</text>
  <text x="104" y="180" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">₩35,000</text>
  <rect x="104" y="196" width="36" height="16" rx="4" fill="#DCFCE7"/>
  <text x="110" y="208" font-size="7" fill="#16A34A" font-family="Arial" font-weight="bold">NEW</text>
  <!-- Card 2 -->
  <rect x="250" y="120" width="210" height="105" rx="8" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
  <rect x="262" y="132" width="60" height="60" rx="6" fill="#BFDBFE"/>
  <text x="280" y="168" font-size="20" fill="#3B82F6">🦐</text>
  <text x="334" y="148" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">독도 활새우 500g</text>
  <text x="334" y="164" font-size="9" fill="#60A5FA" font-family="Arial">해양수산</text>
  <text x="334" y="180" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">₩28,000</text>
  <rect x="334" y="196" width="36" height="16" rx="4" fill="#DCFCE7"/>
  <text x="340" y="208" font-size="7" fill="#16A34A" font-family="Arial" font-weight="bold">NEW</text>
  <!-- Card 3 -->
  <rect x="20" y="237" width="210" height="105" rx="8" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
  <rect x="32" y="249" width="60" height="60" rx="6" fill="#BFDBFE"/>
  <text x="50" y="285" font-size="20" fill="#3B82F6">🦑</text>
  <text x="104" y="265" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">통영산 활 바다장어</text>
  <text x="104" y="281" font-size="9" fill="#60A5FA" font-family="Arial">자산어보</text>
  <text x="104" y="297" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">₩42,000</text>
  <!-- Card 4 -->
  <rect x="250" y="237" width="210" height="105" rx="8" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
  <rect x="262" y="249" width="60" height="60" rx="6" fill="#BFDBFE"/>
  <text x="280" y="285" font-size="20" fill="#3B82F6">🦀</text>
  <text x="334" y="265" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">연평도 활 암꽃게</text>
  <text x="334" y="281" font-size="9" fill="#60A5FA" font-family="Arial">장터사회적협동조합</text>
  <text x="334" y="297" font-size="10" fill="#1E40AF" font-family="Arial" font-weight="bold">₩55,000</text>
  <!-- Status badge -->
  <rect x="350" y="330" width="100" height="24" rx="12" fill="#3B82F6"/>
  <text x="362" y="346" font-size="10" fill="white" font-family="Arial" font-weight="bold">⟳ 수집 중...</text>
</svg>