<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="12" fill="#F5F3FF"/>
  <!-- Before card -->
  <rect x="20" y="20" width="200" height="320" rx="10" fill="white" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="40" y="50" font-size="11" fill="#7C3AED" font-family="Arial" font-weight="bold">도매 원본</text>
  <rect x="32" y="64" width="176" height="90" rx="6" fill="#EDE9FE"/>
  <rect x="32" y="166" width="140" height="12" rx="3" fill="#6D28D9"/>
  <rect x="32" y="186" width="176" height="8" rx="2" fill="#DDD6FE"/>
  <rect x="32" y="200" width="160" height="8" rx="2" fill="#DDD6FE"/>
  <rect x="32" y="214" width="120" height="8" rx="2" fill="#DDD6FE"/>
  <rect x="32" y="240" width="60" height="20" rx="4" fill="#F3F4F6"/>
  <text x="42" y="254" font-size="9" fill="#6B7280" font-family="Arial">₩15,000</text>
  <!-- Arrow -->
  <g transform="translate(230, 150)">
    <circle cx="10" cy="10" r="20" fill="#7C3AED"/>
    <text x="2" y="16" font-size="14" fill="white" font-family="Arial" font-weight="bold">AI</text>
  </g>
  <!-- After card -->
  <rect x="270" y="20" width="200" height="320" rx="10" fill="white" stroke="#A78BFA" stroke-width="2"/>
  <text x="290" y="50" font-size="11" fill="#7C3AED" font-family="Arial" font-weight="bold">AI 가공 완료</text>
  <rect x="282" y="64" width="176" height="90" rx="6" fill="#EDE9FE"/>
  <!-- Sparkle icons -->
  <circle cx="440" cy="74" r="8" fill="#A78BFA"/>
  <text x="436" y="78" font-size="10" fill="white">✨</text>
  <rect x="282" y="166" width="160" height="12" rx="3" fill="#6D28D9"/>
  <rect x="282" y="186" width="176" height="8" rx="2" fill="#C4B5FD"/>
  <rect x="282" y="200" width="176" height="8" rx="2" fill="#C4B5FD"/>
  <rect x="282" y="214" width="176" height="8" rx="2" fill="#C4B5FD"/>
  <rect x="282" y="228" width="140" height="8" rx="2" fill="#C4B5FD"/>
  <!-- Price tags -->
  <rect x="282" y="250" width="80" height="24" rx="6" fill="#7C3AED"/>
  <text x="292" y="266" font-size="10" fill="white" font-family="Arial" font-weight="bold">₩29,900</text>
  <rect x="370" y="250" width="60" height="24" rx="6" fill="#EDE9FE"/>
  <text x="378" y="266" font-size="9" fill="#7C3AED" font-family="Arial">배송비별도</text>
  <!-- Options -->
  <rect x="282" y="286" width="50" height="20" rx="4" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="290" y="300" font-size="8" fill="#7C3AED" font-family="Arial">1kg</text>
  <rect x="338" y="286" width="50" height="20" rx="4" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="346" y="300" font-size="8" fill="#7C3AED" font-family="Arial">2kg</text>
  <rect x="394" y="286" width="50" height="20" rx="4" fill="#7C3AED"/>
  <text x="402" y="300" font-size="8" fill="white" font-family="Arial">3kg</text>
  <!-- Status badge -->
  <rect x="282" y="316" width="90" height="20" rx="10" fill="#22C55E"/>
  <text x="295" y="330" font-size="9" fill="white" font-family="Arial" font-weight="bold">변환 완료 ✓</text>
</svg>