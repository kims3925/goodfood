<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="12" fill="#F0FDF4"/>
  <!-- Band app frame -->
  <rect x="30" y="20" width="200" height="320" rx="16" fill="white" stroke="#BBF7D0" stroke-width="2"/>
  <rect x="30" y="20" width="200" height="40" rx="16" fill="#16A34A"/>
  <rect x="30" y="44" width="200" height="16" fill="#16A34A"/>
  <text x="90" y="45" font-size="12" fill="white" font-family="Arial" font-weight="bold">Band</text>
  <!-- Band post -->
  <rect x="42" y="70" width="176" height="250" rx="8" fill="#F0FDF4"/>
  <rect x="52" y="80" width="156" height="100" rx="6" fill="#BBF7D0"/>
  <!-- Image grid -->
  <rect x="56" y="84" width="72" height="44" rx="3" fill="#86EFAC"/>
  <rect x="132" y="84" width="72" height="44" rx="3" fill="#86EFAC"/>
  <rect x="56" y="132" width="72" height="44" rx="3" fill="#86EFAC"/>
  <rect x="132" y="132" width="72" height="44" rx="3" fill="#86EFAC"/>
  <text x="80" y="110" font-size="8" fill="#166534">IMG</text>
  <text x="156" y="110" font-size="8" fill="#166534">IMG</text>
  <!-- Post content -->
  <rect x="52" y="192" width="140" height="10" rx="2" fill="#166534"/>
  <rect x="52" y="208" width="156" height="6" rx="2" fill="#BBF7D0"/>
  <rect x="52" y="220" width="156" height="6" rx="2" fill="#BBF7D0"/>
  <rect x="52" y="232" width="120" height="6" rx="2" fill="#BBF7D0"/>
  <!-- Order link -->
  <rect x="52" y="252" width="156" height="30" rx="6" fill="#16A34A"/>
  <text x="85" y="272" font-size="10" fill="white" font-family="Arial" font-weight="bold">주문하기 →</text>
  <!-- Arrow -->
  <g transform="translate(240, 160)">
    <rect width="30" height="30" rx="15" fill="#16A34A"/>
    <text x="8" y="21" font-size="16" fill="white">→</text>
  </g>
  <!-- Shop frame -->
  <rect x="280" y="20" width="180" height="320" rx="10" fill="white" stroke="#BBF7D0" stroke-width="2"/>
  <rect x="280" y="20" width="180" height="36" rx="10" fill="#F0FDF4"/>
  <rect x="280" y="46" width="180" height="10" fill="#F0FDF4"/>
  <text x="320" y="44" font-size="10" fill="#16A34A" font-family="Arial" font-weight="bold">🛒 내 쇼핑몰</text>
  <!-- Shop product -->
  <rect x="292" y="66" width="156" height="90" rx="6" fill="#DCFCE7"/>
  <rect x="292" y="168" width="120" height="10" rx="2" fill="#166534"/>
  <rect x="292" y="184" width="80" height="8" rx="2" fill="#BBF7D0"/>
  <rect x="292" y="204" width="70" height="20" rx="4" fill="#16A34A"/>
  <text x="302" y="218" font-size="9" fill="white" font-family="Arial" font-weight="bold">₩29,900</text>
  <!-- Toss Pay button -->
  <rect x="292" y="240" width="156" height="36" rx="8" fill="#3B82F6"/>
  <text x="325" y="264" font-size="11" fill="white" font-family="Arial" font-weight="bold">결제하기</text>
  <!-- Success badge -->
  <rect x="310" y="296" width="120" height="28" rx="14" fill="#16A34A"/>
  <text x="325" y="315" font-size="10" fill="white" font-family="Arial" font-weight="bold">발행 완료 ✓</text>
</svg>